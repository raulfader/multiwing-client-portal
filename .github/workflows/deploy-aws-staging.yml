name: Deploy Multiwing AWS Duplicate Staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - infra/template.yaml
      - .github/workflows/deploy-aws-staging.yml

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-deploy-foundation:
    name: Validate and deploy isolated staging foundation
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      STACK_NAME: multiwing-staging
      CFN_EXECUTION_ROLE_ARN: arn:aws:iam::735252691868:role/multiwing-cloudformation-execution
    steps:
      - name: Check out duplicate source
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install duplicate runtime dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate duplicate safety guards
        run: pnpm vitest run server/duplicateSafety.test.ts server/aws/runtimeConfig.test.ts && pnpm check
      - name: Configure isolated Multiwing deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::735252691868:role/multiwing-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
      - name: Validate non-production template
        run: sam validate --template-file infra/template.yaml
      - name: Build duplicate Lambda artifact
        run: rm -rf .lambda-build && mkdir -p .lambda-build && ARTIFACTS_DIR="${GITHUB_WORKSPACE}/.lambda-build" make build-DuplicateApiFunction
      - name: Recover known non-production rollback state
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].StackStatus' --output text)
          if [ "$STACK_STATUS" = "UPDATE_ROLLBACK_FAILED" ]; then
            aws cloudformation continue-update-rollback --stack-name "$STACK_NAME" --region "$AWS_REGION"
            for _ in $(seq 1 60); do
              STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].StackStatus' --output text)
              [ "$STACK_STATUS" = "UPDATE_ROLLBACK_COMPLETE" ] && break
              [ "$STACK_STATUS" = "UPDATE_ROLLBACK_FAILED" ] && exit 1
              sleep 10
            done
            [ "$STACK_STATUS" = "UPDATE_ROLLBACK_COMPLETE" ] || exit 1
          fi
      - name: Deploy isolated duplicate runtime
        run: |
          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='PortalAssetsBucketName'].OutputValue" --output text)
          sam deploy --template-file infra/template.yaml --s3-bucket "$ARTIFACT_BUCKET" --s3-prefix sam-artifacts --no-confirm-changeset --no-fail-on-empty-changeset --stack-name "$STACK_NAME" --role-arn "$CFN_EXECUTION_ROLE_ARN" --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND --parameter-overrides EnvironmentName=staging AdminEmail=raul@faderlabs.com
      - name: Report non-sensitive duplicate outputs
        run: aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[].[OutputKey,OutputValue]" --output table
