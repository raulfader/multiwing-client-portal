  PortalAssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: multiwing
        - Key: Purpose
          Value: staging-portal-assets

  PrivateMediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: transition-noncurrent-copy-versions
            Status: Enabled
            NoncurrentVersionTransitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 30
      Tags:
        - Key: Project
          Value: multiwing
        - Key: Purpose
          Value: private-staging-media-duplicate
        - Key: DataClassification
          Value: client-media

  MigrationAuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: retain-audit-evidence
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
      Tags:
        - Key: Project
          Value: multiwing
        - Key: Purpose
          Value: migration-reconciliation-evidence

  ApplicationConfig:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub /multiwing/${AWS::StackName}/application
      Description: Empty Multiwing duplicate configuration. Source credentials and production recipient settings must not be added during foundation provisioning.
      GenerateSecretString:
        GenerateStringKey: SESSION_SECRET
        PasswordLength: 64
        ExcludeCharacters: '"@/\\'
        SecretStringTemplate: !Sub |
          {
            "APP_ENV":"${EnvironmentName}",
            "OWNER_EMAIL":"${AdminEmail}",
            "SOURCE_MUTATION_ALLOWED":"false",
            "DUPLICATE_MODE":"true",
            "CLIENT_EMAIL_ENABLED":"false",
            "LIVE_DNS_CHANGE_ALLOWED":"false"
          }

Outputs:
  VpcId:
    Value: !Ref MultiwingVpc
  ApplicationSecurityGroupId:
    Value: !Ref ApplicationSecurityGroup
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
  DatabaseEndpoint:
    Value: !GetAtt MultiwingDatabase.Endpoint.Address
  DatabaseMasterSecretArn:
    Value: !GetAtt MultiwingDatabase.MasterUserSecret.SecretArn
  PortalAssetsBucketName:
    Value: !Ref PortalAssetsBucket
  PrivateMediaBucketName:
    Value: !Ref PrivateMediaBucket
  MigrationAuditBucketName:
    Value: !Ref MigrationAuditBucket
  ApplicationConfigSecretArn:
    Value: !Ref ApplicationConfig
